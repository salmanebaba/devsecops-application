apiVersion: v1
kind: Namespace
metadata:
  name: devsecops-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-budget
  namespace: devsecops-staging
spec:
  hard:
    pods: '6'
    requests.cpu: 800m
    requests.memory: 768Mi
    limits.cpu: '2'
    limits.memory: 1200Mi
    requests.storage: 5Gi
    persistentvolumeclaims: '1'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: devsecops-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  namespace: devsecops-staging
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-clients
  namespace: devsecops-staging
spec:
  podSelector:
    matchLabels:
      role: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: role
          operator: In
          values:
          - api
          - migration
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-database-egress
  namespace: devsecops-staging
spec:
  podSelector:
    matchExpressions:
    - key: role
      operator: In
      values:
      - api
      - migration
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          role: postgres
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verification-http
  namespace: devsecops-staging
spec:
  podSelector:
    matchLabels:
      role: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: verifier
    ports:
    - protocol: TCP
      port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verification-egress
  namespace: devsecops-staging
spec:
  podSelector:
    matchLabels:
      role: verifier
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          role: api
    ports:
    - protocol: TCP
      port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devsecops-staging
spec:
  selector:
    role: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devsecops-staging
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      role: postgres
  template:
    metadata:
      labels:
        role: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        args:
        - postgres
        - -c
        - shared_buffers=32MB
        - -c
        - max_connections=20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_USER
          value: lab_admin
        - name: POSTGRES_PASSWORD_FILE
          value: /run/admin/password
        - name: POSTGRES_DB
          value: lab
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256
        - name: APP_DB_PASSWORD_FILE
          value: /run/runtime/password
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: admin
          mountPath: /run/admin
          readOnly: true
        - name: runtime
          mountPath: /run/runtime
          readOnly: true
      volumes:
      - name: init
        configMap:
          name: postgres-init
          defaultMode: 365
      - name: socket
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: admin
        secret:
          secretName: postgres-admin
          defaultMode: 288
          items:
          - key: password
            path: password
      - name: runtime
        secret:
          secretName: database-runtime
          defaultMode: 288
          items:
          - key: password
            path: password
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-__RELEASE_ID__
  namespace: devsecops-staging
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        role: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10000
      containers:
      - name: migrate
        image: __API_IMAGE__
        imagePullPolicy: Never
        args:
        - dist/database/migrate.js
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: MIGRATION_DATABASE_URL_FILE
          value: /run/admin/migration-url
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: admin
          mountPath: /run/admin
          readOnly: true
      volumes:
      - name: admin
        secret:
          secretName: postgres-admin
          defaultMode: 288
          items:
          - key: migration_url
            path: migration-url
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devsecops-staging
spec:
  selector:
    role: api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devsecops-staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      role: api
  template:
    metadata:
      labels:
        role: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10000
      containers:
      - name: api
        image: __API_IMAGE__
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
        - name: DOCS_ENABLED
          value: 'true'
        - name: JWT_TTL_SECONDS
          value: '900'
        - name: NODE_OPTIONS
          value: --max-old-space-size=192
        - name: DATABASE_URL_FILE
          value: /run/runtime/database-url
        - name: JWT_SECRET_FILE
          value: /run/auth/jwt-secret
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: runtime
          mountPath: /run/runtime
          readOnly: true
        - name: auth
          mountPath: /run/auth
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: runtime
        secret:
          secretName: database-runtime
          defaultMode: 288
          items:
          - key: url
            path: database-url
      - name: auth
        secret:
          secretName: api-auth
          defaultMode: 288
          items:
          - key: jwt_secret
            path: jwt-secret
